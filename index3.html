<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Registo de Serviço - Táxi</title>
  
  <!-- Configurações para Web App / Ícone no Telemóvel -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Táxi Registo">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%231a73e8'><rect width='100' height='100' rx='20' fill='%231a73e8'/><text x='50%' y='65%' font-size='50' text-anchor='middle' fill='white'>🚕</text></svg>">
  
  <!-- GOOGLE MAPS API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAdCRK_YgVyufdPfl6bOT4JrFBkwJNLDyE&libraries=places&language=pt"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f8; display: flex; justify-content: center; padding: 15px; }
    
    .phone-container {
      width: 100%;
      max-width: 410px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      overflow: hidden;
      border: 1px solid #e0e0e0;
      margin-bottom: 20px;
    }

    .header { background-color: #1a73e8; color: #ffffff; padding: 16px 20px; text-align: center; }
    .header h2 { font-size: 18px; font-weight: 600; }

    .form-container { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 13px; font-weight: 600; color: #3c4043; }
    
    input[type="text"], input[type="number"], textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input:focus, textarea:focus { border-color: #1a73e8; }
    input[readonly] { background-color: #f1f3f4; color: #5f6368; font-size: 12px; }

    .row { display: flex; gap: 10px; }
    .row .form-group { flex: 1; }

    /* Estilo da Matrícula */
    .matricula-box { display: flex; align-items: center; gap: 4px; }
    .matricula-box input { text-align: center; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }

    /* Estilo Seleção de Veículo e Companhia */
    .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .option-card {
      background: #ffffff;
      border: 2px solid #dadce0;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #3c4043;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .option-card.selected { border-color: #1a73e8; background-color: #e8f0fe; color: #1a73e8; }

    .company-box { background-color: #f8f9fa; border: 1px solid #e8eaed; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

    .input-with-btn { display: flex; gap: 8px; }
    .input-with-btn input { flex: 1; }
    .btn-gps {
      background-color: #e8f0fe;
      border: 1px solid #1a73e8;
      color: #1a73e8;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 16px;
      cursor: pointer;
    }

    /* Checkbox Deslocação */
    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #eef3fc;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #1a73e8;
    }
    .checkbox-container input { width: 18px; height: 18px; cursor: pointer; }

    /* Botões Finais */
    .button-group { display: flex; gap: 10px; margin-top: 6px; }
    .btn-submit { flex: 2; background-color: #1a73e8; color: #ffffff; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-desempenho { flex: 1; background-color: #d93025; color: #ffffff; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }

    .pac-container { border-radius: 8px; border: 1px solid #dadce0; font-family: inherit; }
  </style>
</head>
<body>

  <div class="phone-container">
    <div class="header">
      <h2>Registo de Serviço</h2>
    </div>

    <form class="form-container" id="serviceForm">
      
      <!-- Linha: Motorista e N.º Táxi -->
      <div class="row">
        <div class="form-group" style="flex: 2;">
          <label for="motorista">Motorista *</label>
          <input type="text" id="motorista" placeholder="Nome" required>
        </div>
        <div class="form-group" style="flex: 1;">
          <label for="numTaxi">N.º Táxi *</label>
          <input type="text" id="numTaxi" maxlength="3" placeholder="Ex: 01" required>
        </div>
      </div>

      <!-- Linha: N.º Processo e Matrícula -->
      <div class="row">
        <div class="form-group">
          <label for="numProcesso">N.º Processo / ID *</label>
          <input type="text" id="numProcesso" placeholder="Ex: 10452" required>
        </div>

        <div class="form-group">
          <label>Matrícula (Opcional)</label>
          <div class="matricula-box">
            <input type="text" id="mat1" maxlength="2" placeholder="00">
            <span>-</span>
            <input type="text" id="mat2" maxlength="2" placeholder="AA">
            <span>-</span>
            <input type="text" id="mat3" maxlength="2" placeholder="00">
          </div>
        </div>
      </div>

      <!-- Companhias -->
      <div class="company-box">
        <label>Companhia / Assistência *</label>
        <div class="options-grid">
          <div class="option-card comp-card" onclick="selecionarCompanhia(this, 'RNA')"><span>🚗</span> RNA</div>
          <div class="option-card comp-card" onclick="selecionarCompanhia(this, 'Europ Assistance')"><span>🌍</span> Europ Assistance</div>
          <div class="option-card comp-card" onclick="selecionarCompanhia(this, 'Mapfre')"><span>🛡️</span> Mapfre</div>
          <div class="option-card comp-card" onclick="selecionarCompanhia(this, 'Interpartner')"><span>🤝</span> Interpartner</div>
        </div>
        <input type="text" id="companhiaOutra" placeholder="Outra companhia...">
      </div>

      <!-- Lotação do Veículo (Tarifa) -->
      <div class="form-group">
        <label>Lotação do Veículo</label>
        <div class="options-grid">
          <div class="option-card lot-card selected" onclick="selecionarLotacao(this, '4')">🚗 4 Lugares (X)</div>
          <div class="option-card lot-card" onclick="selecionarLotacao(this, '5+')">🚐 5+ Lugares (Y)</div>
        </div>
      </div>

      <!-- Checkbox Deslocação -->
      <label class="checkbox-container">
        <input type="checkbox" id="checkDeslocacao" onchange="alternarModoDeslocacao()">
        <span>☑ Apenas Deslocação</span>
      </label>

      <!-- Campos de Percurso -->
      <div id="seccaoPercurso">
        <div class="form-group">
          <label for="base">Base (Ponto A)</label>
          <input type="text" id="base" value="Rua Professor Camilo Oliveira 257 São Cosme Gondomar" readonly>
        </div>

        <div class="form-group" style="margin-top: 6px;">
          <label for="origem">Origem (Ponto B) *</label>
          <div class="input-with-btn">
            <input type="text" id="origem" placeholder="Morada de origem..." required>
            <button type="button" class="btn-gps" onclick="capturarGPS('origem')">📍</button>
          </div>
        </div>

        <div class="form-group" style="margin-top: 6px;">
          <label for="destino">Destino (Ponto C) *</label>
          <div class="input-with-btn">
            <input type="text" id="destino" placeholder="Morada de destino..." required>
            <button type="button" class="btn-gps" onclick="capturarGPS('destino')">📍</button>
          </div>
        </div>
      </div>

      <!-- Campo alternativo para Km Efetuados no modo Deslocação -->
      <div class="form-group" id="campoKmDireto" style="display: none;">
        <label for="kmEfetuados">Km Efetuados *</label>
        <input type="number" id="kmEfetuados" placeholder="Introduzir Km totais">
      </div>

      <!-- Passageiros e Portagens -->
      <div class="row">
        <div class="form-group">
          <label for="passageiros">N.º Passageiros</label>
          <input type="number" id="passageiros" value="1" min="1">
        </div>

        <div class="form-group">
          <label for="portagens">Portagens (€)</label>
          <input type="text" id="portagens" value="0.00" inputmode="numeric">
        </div>
      </div>

      <!-- Observações -->
      <div class="form-group">
        <label for="observacoes">Observações</label>
        <textarea id="observacoes" rows="2" placeholder="Notas adicionais..."></textarea>
      </div>

      <!-- Botões Submeter e Desempenho -->
      <div class="button-group">
        <button type="submit" class="btn-submit">Guardar Serviço</button>
        <button type="button" class="btn-desempenho" onclick="enviarDesempenho()">Desempenho</button>
      </div>

    </form>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyywjmjYsbmXpJDYrsLEuAKjcqF_LlyNyJq4kEdvejl6gCbvJJQIBid3FO2z2UP0AUNgQ/exec";
    
    // TABELA DE PREÇOS POR COMPANHIA
    // local = valor fixo para serviços até 25 km
    // x = valor/km para 4 lugares (acima de 25 km)
    // y = valor/km para 5+ lugares (acima de 25 km)
    const TABELA_PRECOS = {
      "RNA": { local: 9.00, x: 0.38, y: 0.40 },
      "Europ Assistance": { local: 7.00, x: 0.38, y: 0.46 },
      "Mapfre": { local: 9.00, x: 0.44, y: 0.50 },
      "Interpartner": { local: 9.00, x: 0.85, y: 1.10 },
      "Padrao": { local: 25.00, x: 0.35, y: 0.39 }

    };

    let companhiaSelecionadaGlobal = "";
    let lotacaoSelecionadaGlobal = "4";

    // Auto-advance na Matrícula
    ['mat1', 'mat2'].forEach((id, index) => {
      document.getElementById(id).addEventListener('input', function() {
        if (this.value.length === 2) {
          document.getElementById(index === 0 ? 'mat2' : 'mat3').focus();
        }
      });
    });

    function initAutocomplete() {
      const options = { componentRestrictions: { country: "pt" } };
      new google.maps.places.Autocomplete(document.getElementById('origem'), options);
      new google.maps.places.Autocomplete(document.getElementById('destino'), options);
    }

    window.onload = function() {
      if (typeof google !== 'undefined' && google.maps && google.maps.places) {
        initAutocomplete();
      }
      carregarRascunho();
    };

    // Formatação de Portagens
    const inputPortagens = document.getElementById('portagens');
    inputPortagens.addEventListener('input', function(e) {
      let valor = e.target.value.replace(/\D/g, "");
      if (valor === "") valor = "0";
      let numero = parseInt(valor, 10) / 100;
      e.target.value = numero.toFixed(2);
      guardarRascunho();
    });

    function selecionarCompanhia(elemento, nomeCompanhia) {
      document.querySelectorAll('.comp-card').forEach(card => card.classList.remove('selected'));
      elemento.classList.add('selected');
      companhiaSelecionadaGlobal = nomeCompanhia;
      document.getElementById("companhiaOutra").value = "";
      guardarRascunho();
    }

    document.getElementById("companhiaOutra").addEventListener("input", function() {
      document.querySelectorAll('.comp-card').forEach(card => card.classList.remove('selected'));
      companhiaSelecionadaGlobal = "";
      guardarRascunho();
    });

    function selecionarLotacao(elemento, tipo) {
      document.querySelectorAll('.lot-card').forEach(card => card.classList.remove('selected'));
      elemento.classList.add('selected');
      lotacaoSelecionadaGlobal = tipo;
      guardarRascunho();
    }

    function capturarGPS(idInput) {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
          document.getElementById(idInput).value = position.coords.latitude + "," + position.coords.longitude;
          guardarRascunho();
        }, function() { alert("Erro ao obter GPS."); });
      }
    }

    function alternarModoDeslocacao() {
      const isChecked = document.getElementById('checkDeslocacao').checked;
      document.getElementById('seccaoPercurso').style.display = isChecked ? 'none' : 'block';
      document.getElementById('campoKmDireto').style.display = isChecked ? 'block' : 'none';
      
      const origemInput = document.getElementById('origem');
      const destinoInput = document.getElementById('destino');
      const kmEfetuadosInput = document.getElementById('kmEfetuados');

      if (isChecked) {
        origemInput.removeAttribute('required');
        destinoInput.removeAttribute('required');
        kmEfetuadosInput.setAttribute('required', 'required');
      } else {
        origemInput.setAttribute('required', 'required');
        destinoInput.setAttribute('required', 'required');
        kmEfetuadosInput.removeAttribute('required');
      }

      guardarRascunho();
    }

    // --- SISTEMA DE GUARDAR RASCUNHO (LOCALSTORAGE) ---
    const camposGuardar = ['motorista', 'numTaxi', 'numProcesso', 'mat1', 'mat2', 'mat3', 'companhiaOutra', 'origem', 'destino', 'passageiros', 'portagens', 'observacoes', 'kmEfetuados', 'checkDeslocacao'];
    
    camposGuardar.forEach(id => {
      const el = document.getElementById(id);
      if(el) el.addEventListener('input', guardarRascunho);
    });

    function guardarRascunho() {
      const dados = {};
      camposGuardar.forEach(id => {
        const el = document.getElementById(id);
        if(el) dados[id] = el.type === 'checkbox' ? el.checked : el.value;
      });
      dados.companhiaSelecionadaGlobal = companhiaSelecionadaGlobal;
      dados.lotacaoSelecionadaGlobal = lotacaoSelecionadaGlobal;
      localStorage.setItem('rascunho_taxi', JSON.stringify(dados));
    }

    function carregarRascunho() {
      const Rascunho = localStorage.getItem('rascunho_taxi');
      if (Rascunho) {
        const dados = JSON.parse(Rascunho);
        camposGuardar.forEach(id => {
          const el = document.getElementById(id);
          if (el && dados[id] !== undefined) {
            if (el.type === 'checkbox') el.checked = dados[id];
            else el.value = dados[id];
          }
        });
        if (dados.companhiaSelecionadaGlobal) {
          companhiaSelecionadaGlobal = dados.companhiaSelecionadaGlobal;
          document.querySelectorAll('.comp-card').forEach(card => {
            if (card.textContent.includes(companhiaSelecionadaGlobal)) card.classList.add('selected');
          });
        }
        if (dados.lotacaoSelecionadaGlobal) {
          lotacaoSelecionadaGlobal = dados.lotacaoSelecionadaGlobal;
          document.querySelectorAll('.lot-card').forEach(card => card.classList.remove('selected'));
          const idx = lotacaoSelecionadaGlobal === '4' ? 0 : 1;
          document.querySelectorAll('.lot-card')[idx].classList.add('selected');
        }
        alternarModoDeslocacao();
      }
    }

    function obterMatricula() {
      const m1 = document.getElementById("mat1").value.trim();
      const m2 = document.getElementById("mat2").value.trim();
      const m3 = document.getElementById("mat3").value.trim();
      return (m1 && m2 && m3) ? `${m1}-${m2}-${m3}`.toUpperCase() : "N/D";
    }

    // --- SUBMETER SERVIÇO NORMAL OU DESLOCAÇÃO ---
    document.getElementById("serviceForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const isDeslocacao = document.getElementById('checkDeslocacao').checked;
      let finalCompanhia = companhiaSelecionadaGlobal || document.getElementById("companhiaOutra").value.trim();
      
      if (!finalCompanhia) {
        alert("Por favor selecione ou escreva o nome da Companhia / Assistência.");
        return;
      }

      if (isDeslocacao && !document.getElementById("kmEfetuados").value) {
        alert("Por favor insira os Km Efetuados.");
        return;
      }

      let precosCompanhia = TABELA_PRECOS[finalCompanhia] || TABELA_PRECOS["Padrao"];
      let portagens = parseFloat(document.getElementById("portagens").value) || 0;
      let kmInput = isDeslocacao ? parseFloat(document.getElementById("kmEfetuados").value) : 0;

      const dados = {
        tipoRegisto: isDeslocacao ? "Deslocação" : "Serviço Normal",
        dataHora: new Date().toLocaleString("pt-PT"),
        motorista: document.getElementById("motorista").value,
        numTaxi: document.getElementById("numTaxi").value,
        numProcesso: document.getElementById("numProcesso").value,
        matricula: obterMatricula(),
        companhia: finalCompanhia,
        lotacao: lotacaoSelecionadaGlobal,
        base: document.getElementById("base").value,
        origem: isDeslocacao ? "N/A" : document.getElementById("origem").value,
        destino: isDeslocacao ? "N/A" : document.getElementById("destino").value,
        kmEfetuados: isDeslocacao ? kmInput : null,
        passageiros: document.getElementById("passageiros").value,
        portagens: portagens,
        observacoes: document.getElementById("observacoes").value,
        taxaAplicada: (lotacaoSelecionadaGlobal === "4") ? precosCompanhia.x : precosCompanhia.y,
        precoLocalFixo: precosCompanhia.local
      };

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(dados)
      })
      .then(res => res.json())
      .then(data => {
        let totalKm = isDeslocacao ? kmInput : parseFloat(data.totalKm);
        let valorServico = 0;
        let mensagemDetalhe = "";

        if (totalKm < 25) {
          valorServico = precosCompanhia.local;
          mensagemDetalhe = `Serviço Local (inferior a 25 km)\nDistância Real: ${totalKm.toFixed(1)} km\nValor Fixo (${finalCompanhia}): ${valorServico.toFixed(2)} €`;
        } else {
          let taxaKm = (lotacaoSelecionadaGlobal === "4") ? precosCompanhia.x : precosCompanhia.y;
          valorServico = totalKm * taxaKm;
          mensagemDetalhe = `Distância Total: ${totalKm.toFixed(1)} km\nTarifa/Km: ${taxaKm.toFixed(2)} €/km`;
        }

        let valorTotal = valorServico + portagens;

        alert(`Serviço guardado com sucesso!\n\n${mensagemDetalhe}\nPortagens: ${portagens.toFixed(2)} €\n-------------------------\nTotal a cobrar: ${valorTotal.toFixed(2)} €`);
        
        localStorage.removeItem('rascunho_taxi');
        document.getElementById("serviceForm").reset();
        location.reload();
      })
      .catch(err => alert("Erro ao enviar dados: " + err));
    });

    // --- BOTÃO DESEMPENHO (CANCELADO) ---
    function enviarDesempenho() {
      const motorista = document.getElementById("motorista").value;
      const numTaxi = document.getElementById("numTaxi").value;
      const numProcesso = document.getElementById("numProcesso").value;

      if (!motorista || !numTaxi || !numProcesso) {
        alert("Para registar Desempenho é necessário preencher: Motorista, N.º Táxi e N.º Processo.");
        return;
      }

      const dados = {
        tipoRegisto: "Desempenho / Cancelado",
        dataHora: new Date().toLocaleString("pt-PT"),
        motorista: motorista,
        numTaxi: numTaxi,
        numProcesso: numProcesso,
        matricula: obterMatricula(),
        companhia: companhiaSelecionadaGlobal || document.getElementById("companhiaOutra").value || "Não especificada",
        observacoes: document.getElementById("observacoes").value
      };

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(dados)
      })
      .then(() => {
        alert("Registo de Desempenho guardado com sucesso!");
        localStorage.removeItem('rascunho_taxi');
        document.getElementById("serviceForm").reset();
        location.reload();
      })
      .catch(err => alert("Erro ao enviar Desempenho: " + err));
    }
  </script>

</body>
</html>
